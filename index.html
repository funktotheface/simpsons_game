<!doctype html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8" />
    <title>Making your first Phaser 3 Game - Part 1</title>
    <script src="//cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.js"></script>
    <style type="text/css">
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
        display: block;
        }
    </style>
</head>
<body>

<script type="text/javascript">

    var score = 0
    var scoreText;

    var config = {
        type: Phaser.AUTO,
        width: 800,
        height: 600,
        physics: {
        default: 'arcade',
        arcade: {
            gravity: {y: 600 },
            debug: false
        }
    },
        scene: {
            preload: preload,
            create: create,
            update: update
        }
    };

    var game = new Phaser.Game(config);


    function preload ()
    {
        this.load.image('sky', 'assets/sky.png');
        this.load.image('ground', 'assets/platform.png');
        this.load.image('star', 'assets/star.png');
        this.load.image('bomb', 'assets/bomb.png');
        this.load.atlas(
            'homer',
            'assets/homer_sprite_sheet.png',
            'assets/homer_sprite_sheet.json'
        );
    

    }

    function create ()
    {
        this.add.image(400, 300, 'sky');
        platforms = this.physics.add.staticGroup();
        platforms.create(400, 568, 'ground').setScale(2).refreshBody();
        platforms.create(600, 400, 'ground');
        platforms.create(50, 250, 'ground');
        platforms.create(750, 220, 'ground');

        player = this.physics.add.sprite(100, 450, 'homer', 'idle-1');
        
        this.physics.add.collider(player, platforms);
        player.setBounce(0.1);
        player.setCollideWorldBounds(true);

        player.preFX.setPadding(16);

        var homerShadow = player.preFX.addShadow(
            4,
            4,
            0.1,
            1,
            0x000000,
            6,
            0.3
        );

        this.anims.create({
            key: 'walk-right',
        
            frames: [
                { key: 'homer', frame: 'walk-1'},
                { key: 'homer', frame: 'walk-2'},
                { key: 'homer', frame: 'walk-3'},
                { key: 'homer', frame: 'walk-4'},
                { key: 'homer', frame: 'walk-5'},
                { key: 'homer', frame: 'walk-6'},
                { key: 'homer', frame: 'walk-7'},
                { key: 'homer', frame: 'walk-8'},
                
            ],
            
        frameRate: 10,
        repeat: -1
        });
        
        this.anims.create({
            key: 'stand-idle',
        
            frames: [
                { key: 'homer', frame: 'idle-1'},
                { key: 'homer', frame: 'idle-2'},
                { key: 'homer', frame: 'idle-3'},
                { key: 'homer', frame: 'idle-4'},
                { key: 'homer', frame: 'idle-3'},
                { key: 'homer', frame: 'idle-2'},
                { key: 'homer', frame: 'idle-1'},
                
                
            ],
            
        frameRate: 10,
        repeat: 0
        });

        this.anims.create({
            key: 'jumping',
        
            frames: [
                { key: 'homer', frame: 'jump'},
            ],
            
        frameRate: 10,
        repeat: -1
        });

        this.anims.create({
            key: 'punch',
        
            frames: [
                { key: 'homer', frame: 'punch-1'},
                { key: 'homer', frame: 'punch-2'},
                { key: 'homer', frame: 'punch-3'},
                { key: 'homer', frame: 'punch-4'},
                { key: 'homer', frame: 'punch-5'},
                { key: 'homer', frame: 'punch-6'},
            ],
            
        frameRate: 10,
        repeat: 0
        });
        
        function scheduleIdle()
        {
            var delay = Phaser.Math.Between(2000, 6000)


            this.time.delayedCall(delay, function() {
                const isPunching = 
                    player.anims.currentAnim?.key === 'punch' &&
                    player.anims.isPlaying 

                if (player.body.blocked.down && 
                    player.body.velocity.x === 0 &&
                    !isPunching) {
                    player.anims.play('stand-idle')
                } 
            scheduleIdle.call(this)
                }, [], this)
            }
        scheduleIdle.call(this)
        

        

        cursors = this.input.keyboard.createCursorKeys();
        attackKey = this.input.keyboard.addKey("Z")

        stars = this.physics.add.group({
            key: 'star',
            repeat: 11,
            setXY: { x: 12, y: 0, stepX: 70}
        });

        stars.children.iterate(function(child) {
            child.setCollideWorldBounds(true);
        });

        

        this.physics.add.collider(stars, platforms);
        this.physics.add.overlap(player, stars, collectStar, null, this);

        stars.children.iterate(function (child) {
            child.setBounceY(Phaser.Math.FloatBetween(0.4, 0.8));
        })

        
        scoreText = this.add.text(16, 16, 'score: 0', { fontSize: '32px', fill: '#000'});

        function collectStar (player, star)
        {
            star.disableBody(true, true);

            score += 10
            scoreText.setText('score: ' + score)
        }

        

        

        

        

        
    }

    function update ()
    {

        const isPunching = 
            player.anims.currentAnim?.key === 'punch' &&
            player.anims.isPlaying

            const isIdling = 
            player.anims.currentAnim?.key ===  'stand-idle' &&
            player.anims.isPlaying

            const isJumping = 
                player.anims.currentAnim?.key === 'jumping' &&
                player.anims.isPlaying

        if (cursors.right.isDown)
        {
            player.setVelocityX(160);
            player.setFlipX(false)

            if (player.body.blocked.down &&
            ! isPunching) {
            player.anims.play('walk-right', true)
            }
        }

        else if (cursors.left.isDown)
        {
            player.setVelocityX(-160);
            player.setFlipX(true)

            if (player.body.blocked.down &&
                ! isPunching) {
                player.anims.play('walk-right', true)
                }
            }
        else{
            player.setVelocityX(0)


            if (isPunching ||  isIdling) {
            }

            else if (player.body.blocked.down) {
            player.anims.stop()
            player.setFrame('idle-1')}
        }

            
        

        if (cursors.up.isDown && player.body.blocked.down) {
            player.setVelocityY(-300)
            player.anims.play('jumping', true)
        }

        if (Phaser.Input.Keyboard.JustDown(attackKey)) {
        player.anims.play('punch', true)
        }

        
        
        
        stars.children.iterate(function(child) {
            if (child.body.touching.down){
                child.setVelocityY(-600)

                if (Math.random()  > 0.5) {
                child.setVelocityX(250)}
                else {
                child.setVelocityX(-250)
            }
        }
            
        })
        
        
        
    
}
</script>

</body>
</html>
